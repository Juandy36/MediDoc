[extend]
useDefault = true

[[rules]]
id = "neon-postgres-url"
description = "URL de conexión Postgres con credenciales"
regex = '''postgres(?:ql)?://[^:\s]+:[^@\s]+@[^\s'"]+'''

[[rules]]
id = "field-encryption-key"
description = "Clave de cifrado de campos"
regex = '''FIELD_ENCRYPTION_KEY\s*=\s*['"]?[A-Za-z0-9+/=]{20,}'''
